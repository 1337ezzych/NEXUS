name: NEXUS

options:
  bundleIdPrefix: com.1337ezzych
  deploymentTarget:
    iOS: "16.0"

settings:
  base:
    SWIFT_VERSION: "5.0"
    IPHONEOS_DEPLOYMENT_TARGET: "16.0"
    TARGETED_DEVICE_FAMILY: "1,2"

targets:
  NEXUS:
    type: application
    platform: iOS
    sources:
      - path: Sources/NEXUS
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.1337ezzych.nexus
        PRODUCT_NAME: NEXUS
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: NEXUS
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        CODE_SIGNING_ALLOWED: YES
